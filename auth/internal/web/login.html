<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRide — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span>
      Live API
    </div>

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg class="brand-icon-check" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 11 2 2 4-4"></path>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">SafeRide</span>
        <span class="brand-tag">Rider safety portal</span>
      </div>
    </div>

    <!-- Step Dot Indicator -->
    <div class="step-row">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <!-- Main Form -->
    <div class="title">Welcome Back</div>
    <div class="subtitle">Enter your email linked to your SafeRide IoT device.</div>

    <!-- Register Link -->
    <div style="margin-top: 16px; margin-bottom: 16px; font-size: 14px; color: var(--sr-text-secondary); text-align: center;">
      Need to register a device? <a href="#" id="link-register" style="color: var(--sr-primary); text-decoration: underline;">Register here</a>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" id="email" class="form-input" placeholder="rider@example.com" required>
      </div>

      <div id="error-box" class="error-alert"></div>

      <button type="submit" id="btn-submit" class="submit-btn">
        Request Verification Code
      </button>

      <div style="text-align: center; margin: 16px 0; color: var(--sr-text-secondary); font-size: 14px;">
        &mdash; OR &mdash;
      </div>

      <a href="/api/v1/auth/google/login" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: white; color: #3c4043; border: 1px solid #dadce0; border-radius: 6px; text-decoration: none; font-weight: 500; font-size: 15px; cursor: pointer; transition: background 0.2s;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </a>
    </form>

    <div class="footer">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Your data is end-to-end encrypted
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
