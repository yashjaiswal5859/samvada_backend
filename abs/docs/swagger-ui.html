<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samvada AI — ABS Platform API (Swagger UI)</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    :root {
      --sa-bg: #090d16;
      --sa-surface: #111827;
      --sa-border: #1e293b;
      --sa-primary: #10b981;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--sa-bg) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .swagger-ui .topbar { display: none; }
    .swagger-ui { background: var(--sa-bg) !important; color: #e2e8f0; }
    .swagger-ui .info .title { color: #f8fafc; font-weight: 700; }
    .swagger-ui .info p,
    .swagger-ui .info li,
    .swagger-ui .info a { color: #94a3b8; }
    .swagger-ui .scheme-container { background: var(--sa-surface); box-shadow: none; border-bottom: 1px solid var(--sa-border); }
    .swagger-ui .opblock-tag { color: #f8fafc !important; border-bottom: 1px solid var(--sa-border); }
    .swagger-ui .opblock { border: 1px solid var(--sa-border); background: var(--sa-surface); border-radius: 12px; margin-bottom: 12px; }
    .swagger-ui .opblock .opblock-summary { border: none; }
    .swagger-ui .opblock .opblock-summary-description { color: #94a3b8; }
    .swagger-ui .opblock-body { background: #0f172a; }
    .swagger-ui .opblock.opblock-post { border-color: rgba(16, 185, 129, 0.4); }
    .swagger-ui .opblock.opblock-post .opblock-summary { background: rgba(16, 185, 129, 0.08); }
    .swagger-ui .opblock.opblock-get { border-color: rgba(59, 130, 246, 0.4); }
    .swagger-ui .opblock.opblock-get .opblock-summary { background: rgba(59, 130, 246, 0.08); }
    .swagger-ui .opblock.opblock-put { border-color: rgba(245, 158, 11, 0.4); }
    .swagger-ui .opblock.opblock-put .opblock-summary { background: rgba(245, 158, 11, 0.08); }
    .swagger-ui .opblock.opblock-delete { border-color: rgba(239, 68, 68, 0.4); }
    .swagger-ui .opblock.opblock-delete .opblock-summary { background: rgba(239, 68, 68, 0.08); }
    .swagger-ui table thead tr td, .swagger-ui table thead tr th { color: #f8fafc; border-bottom: 1px solid var(--sa-border); }
    .swagger-ui .response-col_status { color: #f8fafc; font-weight: 600; }
    .swagger-ui .response-col_description { color: #94a3b8; }
    .swagger-ui .parameter__name { color: #f8fafc; }
    .swagger-ui .parameter__type { color: #94a3b8; }
    .swagger-ui .model-title { color: #f8fafc; }
    .swagger-ui .model { color: #94a3b8; }
    .swagger-ui section.models { border: 1px solid var(--sa-border); background: var(--sa-surface); border-radius: 12px; }
    .swagger-ui section.models h4 { color: #f8fafc; }
    .swagger-ui .btn { border-radius: 8px; }
    .swagger-ui .markdown p, .swagger-ui .markdown li { color: #94a3b8; }
    .swagger-ui .markdown code { background: #1e293b; color: #10b981; padding: 2px 6px; border-radius: 4px; }
    .swagger-ui .highlight-code pre { background: #020617 !important; border-radius: 8px; }
    #swagger-ui { max-width: 1280px; margin: 0 auto; padding: 28px; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: '/docs/openapi.yaml?v=2.1.0',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIBundle.SwaggerUIStandalonePreset
      ],
      layout: 'BaseLayout',
      defaultModelsExpandDepth: 2,
      defaultModelExpandDepth: 2,
      docExpansion: 'list',
      filter: true,
      showExtensions: true
    });
  </script>
</body>
</html>
