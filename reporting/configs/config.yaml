app:
  name: "samvada-reporting"
  env: "development"
  http_port: 8083
  grpc_port: 9083
  log_level: "debug"

database:
  host: "localhost"
  port: 5432
  user: "samvada"
  password: "samvada_dev_2026"
  dbname: "samvada_abs"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_min: 15

clickhouse:
  addr: "localhost:9000"
  database: "samvada_analytics"
  user: "samvada"
  password: "samvada_ch_2026"
  max_open_conns: 20
  max_idle_conns: 10
  dial_timeout_sec: 10

redis:
  addr: "localhost:6379"
  password: ""
  db: 2
  pool_size: 50

kafka:
  brokers:
    - "localhost:9092"
  consumer_group: "samvada-reporting-consumer"
  topics:
    call_completed: "s2s.call.completed"
    call_turns: "s2s.call.turns"
    call_started: "s2s.call.started"

auth:
  jwt_secret: "samvada_jwt_super_secret_dev_2026_key"

batch:
  ring_buffer_size: 1000
  flush_interval_ms: 5000
