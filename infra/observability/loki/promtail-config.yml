# =============================================================================
# Samvada Platform — Promtail Log Shipper Configuration (Phase 6.1)
# Collects JSON structured logs from Docker containers & microservice stdout
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: samvada-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/samvada-(.*)'
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            ts: ts
            caller: caller
            correlation_id: correlation_id
            trace_id: trace_id
            span_id: span_id
            status: status
            latency: latency
      - labels:
          level:
          correlation_id:
          trace_id:
          status:
