apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-abs
  labels:
    app.kubernetes.io/name: abs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.abs.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: abs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: abs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: abs
          image: "{{ .Values.abs.image.repository }}:{{ .Values.abs.image.tag }}"
          imagePullPolicy: {{ .Values.abs.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.abs.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.abs.service.grpcPort }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.abs.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: abs
  labels:
    app.kubernetes.io/name: abs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: grpc
      port: 9082
      targetPort: 9082
  selector:
    app.kubernetes.io/name: abs
