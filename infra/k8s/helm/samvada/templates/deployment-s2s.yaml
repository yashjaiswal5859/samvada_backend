apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-s2s
  labels:
    app.kubernetes.io/name: s2s
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.s2s.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: s2s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s2s
    spec:
      containers:
        - name: s2s
          image: "{{ .Values.s2s.image.repository }}:{{ .Values.s2s.image.tag }}"
          imagePullPolicy: {{ .Values.s2s.image.pullPolicy }}
          ports:
            - name: ws
              containerPort: {{ .Values.s2s.service.port }}
          resources:
            {{- toYaml .Values.s2s.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: s2s
  labels:
    app.kubernetes.io/name: s2s
spec:
  type: ClusterIP
  ports:
    - name: ws
      port: 8084
      targetPort: 8084
  selector:
    app.kubernetes.io/name: s2s
