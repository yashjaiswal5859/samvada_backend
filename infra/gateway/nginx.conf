# =============================================================================
# Samvada Platform — Enterprise API Gateway Reverse Proxy Configuration
# Production Hardened: Enforces HTTPS-only, TLS 1.3, HSTS, and Security Headers
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream Microservice Definitions
    upstream auth_service {
        server auth:8080;
    }

    upstream abs_service {
        server abs:8082;
    }

    upstream reporting_service {
        server reporting:8083;
    }

    upstream s2s_service {
        server s2s:8084;
    }

    # Conditional HSTS: Enabled in production, omitted on localhost to prevent local dev SSL lockout
    map $host $hsts_header {
        localhost "";
        127.0.0.1 "";
        default "max-age=31536000; includeSubDomains";
    }

    # =========================================================================
    # 1. Public HTTP Server (Port 80) — Permanent 301 Redirect to HTTPS
    # Enforces HTTPS-only across incoming public plaintext connections (Phase 6.2)
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Health probe permitted over HTTP for container orchestrator liveness checks
        location = /health {
            return 200 '{"status":"UP","gateway":"samvada-gateway","protocol":"http"}';
            add_header Content-Type application/json;
        }

        # All other HTTP requests on port 80 are redirected permanently to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. API Gateway Server (Port 8080 HTTP & Port 443 HTTPS)
    # Enterprise Reverse Proxy: Serves direct API Gateway traffic (:8080) and
    # hardened TLS (:443) with identical routing across microservices.
    # =========================================================================
    server {
        listen 8080;
        listen 443 ssl http2;
        server_name localhost _;

        # TLS Certificate Configuration (used for port 443)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Modern TLS Security Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Enterprise Security Headers (Phase 6.2 Hardening)
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' wss: https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' https: data:; frame-ancestors 'none';" always;

        # Global Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 0. Gateway Level JWT Verification Subrequest (Phase 0.4)
        location = /_auth_validate {
            internal;
            proxy_pass http://auth_service/api/v1/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # 1. Auth Service Routes (:8081)
        location /api/v1/auth {
            proxy_pass http://auth_service;
        }

        location /api/v1/security {
            proxy_pass http://auth_service;
        }

        # 2. Application & Billing Service (ABS) Routes (:8082)
        location /api/v1/user {
            proxy_pass http://abs_service;
        }

        location /api/v1/onboarding {
            proxy_pass http://abs_service;
        }

        location /api/v1/orgs {
            proxy_pass http://abs_service;
        }

        location /api/v1/workspaces {
            proxy_pass http://abs_service;
        }

        location /api/v1/agents {
            proxy_pass http://abs_service;
        }

        location /api/v1/billing {
            proxy_pass http://abs_service;
        }

        location /api/v1/kb {
            proxy_pass http://abs_service;
        }

        location /api/v1/campaigns {
            proxy_pass http://abs_service;
        }

        location /api/v1/audiences {
            proxy_pass http://abs_service;
        }

        location /api/v1/phone-numbers {
            proxy_pass http://abs_service;
        }

        location /api/v1/api-keys {
            proxy_pass http://abs_service;
        }

        location /api/v1/webhooks {
            proxy_pass http://abs_service;
        }

        location /api/v1/notifications {
            proxy_pass http://abs_service;
        }

        location /api/v1/integrations {
            proxy_pass http://abs_service;
        }

        location /api/v1/audit-logs {
            proxy_pass http://abs_service;
        }

        location /api/v1/catalog {
            proxy_pass http://abs_service;
        }

        location /api/v1/admin {
            proxy_pass http://abs_service;
        }

        location /swagger {
            proxy_pass http://abs_service;
        }

        location /docs {
            proxy_pass http://abs_service;
        }

        # 3. Reporting Engine Routes (:8083)
        location /api/v1/analytics {
            proxy_pass http://reporting_service;
        }

        location /api/v1/calls {
            proxy_pass http://reporting_service;
        }

        # 4. Speech-to-Speech (S2S) Real-time WebSockets (:8084)
        location /ws/ {
            proxy_pass http://s2s_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 5. Prometheus Metrics
        location /metrics {
            proxy_pass http://abs_service/metrics;
        }

        # 6. Health probe for Gateway (HTTPS)
        location /health {
            return 200 '{"status":"UP","gateway":"samvada-gateway","protocol":"https"}';
            add_header Content-Type application/json;
        }

        # 7. Headless API Gateway Root & Status
        location = / {
            return 200 '{"status":"UP","service":"samvada-api-gateway","version":"1.0.0","type":"headless-api-gateway"}';
            add_header Content-Type application/json;
        }

        # 8. Fallback for unknown non-API routes (Pure API Gateway)
        location / {
            return 404 '{"error":"Not Found","message":"Endpoint does not exist on Samvada API Gateway"}';
            add_header Content-Type application/json;
        }
    }
}

